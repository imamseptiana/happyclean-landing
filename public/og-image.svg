<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HappyClean banner</title>
  <desc id="desc">Jasa cuci sofa, kasur, dan springbed di Bogor dan Depok</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#bae6fd" opacity="0.5"/>
  <circle cx="170" cy="530" r="160" fill="#bfdbfe" opacity="0.6"/>
  <rect x="90" y="110" width="1020" height="410" rx="34" fill="#ffffff" opacity="0.82"/>
  <rect x="130" y="150" width="150" height="150" rx="30" fill="url(#card)"/>
  <text x="320" y="215" font-size="78" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">HappyClean</text>
  <text x="320" y="290" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#334155">Jasa Cuci Sofa &amp; Kasur Profesional</text>
  <text x="320" y="345" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#475569">Bogor • Depok • Jabodetabek</text>
  <g transform="translate(130 365)">
    <rect width="260" height="70" rx="16" fill="#0f172a" opacity="0.9"/>
    <text x="130" y="45" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">Cuci Sofa</text>
  </g>
  <g transform="translate(430 365)">
    <rect width="260" height="70" rx="16" fill="#0ea5e9" opacity="0.92"/>
    <text x="130" y="45" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">Cuci Kasur</text>
  </g>
  <g transform="translate(730 365)">
    <rect width="260" height="70" rx="16" fill="#2563eb" opacity="0.9"/>
    <text x="130" y="45" text-anchor="middle" font-size="26" font-family="Arial, Helvetica, sans-serif" fill="#ffffff">Vakum Tungau</text>
  </g>
</svg>
